name: Windows quality and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Require dependency lock
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.lock)) {
            throw 'Generate Cargo.lock on a network-enabled Windows host, validate, and commit it. No unlocked release builds.'
          }
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: Zoomer-windows-x64-unverified
          path: target/x86_64-pc-windows-msvc/release/zoomer.exe
          retention-days: 14
