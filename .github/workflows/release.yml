name: Windows portable candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check tag version and dependency lock
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.lock)) { throw 'Cargo.lock is required' }
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo package version' }
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: ./scripts/Package.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - uses: actions/upload-artifact@v4
        with:
          name: Zoomer-portable-candidate
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Create draft for interactive acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist/*.zip, dist/*.sha256 | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @assets --draft --title "Zoomer $env:GITHUB_REF_NAME" --notes 'Unsigned Windows 10/11 x64 portable candidate. Run docs/WINDOWS_SMOKE_TEST.md and record evidence for this exact build before publishing. SHA-256 is attached. This draft does not claim GUI acceptance.'
