[package]
name = "zoomer"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A small, local Windows frozen-screen magnifier"
build = "build.rs"

[[bin]]
name = "zoomer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
glutin = { version = "0.32.3", default-features = false, features = ["wgl"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["wgl"] }
glow = "0.18.0"
raw-window-handle = "0.6"
tray-icon = { version = "0.26.1", default-features = false }
global-hotkey = "0.10.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
